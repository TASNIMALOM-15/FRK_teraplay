name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Create Capacitor wrapper
        run: |
          mkdir wrapper && cd wrapper
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          mkdir www
          echo '<html><body>Loading...</body></html>' > www/index.html
          cat > capacitor.config.json <<EOF
          {
            "appId": "com.teraplay.app",
            "appName": "TeraPlay",
            "webDir": "www",
            "server": {
              "url": "https://teraplay-swart.vercel.app",
              "cleartext": false
            }
          }
          EOF
          npx cap add android

      - name: Build debug APK
        run: |
          cd wrapper/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: teraplay-apk
          path: wrapper/android/app/build/outputs/apk/debug/app-debug.apk
